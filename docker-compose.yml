version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src/output:/app/src/output
      - ./backend/src/input:/app/src/input
      - ./backend/src/defines:/app/src/defines
      - ./backend/src/data:/app/src/data
    env_file:
      - backend/.env
    security_opt:
      - no-new-privileges:true
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Public URL browsers use (nginx /api/ → backend :8000). Override at build time if needed.
        NEXT_PUBLIC_API_URL: https://www.tfminecraft.net/api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # Uncomment for Season 5 dev landing + staff gate until public launch:
      # - NEXT_PUBLIC_SITE_DEV_GATE=1
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: always
