name: tfmc-staging

services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    environment:
      - SKINS_DEV=1
      - STAFF_KEY=dev-staff-key
      - PLUGIN_KEY=dev-plugin-key
    volumes:
      - ./backend/src/output:/app/src/output
      - ./backend/src/input:/app/src/input
      - ./backend/src/defines:/app/src/defines
      - ./backend/src/data:/app/src/data
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:8001
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
